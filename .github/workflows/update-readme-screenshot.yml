name: Update README Screenshot

on:
  push:
    paths:
      - "screenshot.png"
      - "assets/screenshot.png"
      - "images/screenshot.png"

jobs:
  update-screenshot:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect screenshot path
        id: detect
        run: |
          if [ -f screenshot.png ]; then
            echo "path=screenshot.png" >> $GITHUB_OUTPUT
          elif [ -f assets/screenshot.png ]; then
            echo "path=assets/screenshot.png" >> $GITHUB_OUTPUT
          elif [ -f images/screenshot.png ]; then
            echo "path=images/screenshot.png" >> $GITHUB_OUTPUT
          else
            echo "No screenshot found"
            exit 1
          fi

      - name: Update README screenshot section
        run: |
          path="${{ steps.detect.outputs.path }}"
          echo "Updating README screenshot to: $path"

          # README のスクショ行を置換
          sed -i "s|!

\[UI Screenshot\]

(.*)|![UI Screenshot]($path)|" README.md

      - name: Commit updated README
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add README.md
          git commit -m "Update README screenshot to latest image" || echo "No changes"
          git push
